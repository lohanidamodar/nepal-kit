name: nepal_kit
description: "Nepal toolkit in pure Dart: Bikram Sambat dates, NPR money, amount in words, VAT, phone numbers, address data, receipt PDFs and SMS reminders."
version: 0.1.0
homepage: https://github.com/lohanidamodar/nepal-kit
repository: https://github.com/lohanidamodar/nepal-kit/tree/main/packages/nepal_kit
issue_tracker: https://github.com/lohanidamodar/nepal-kit/issues
topics:
  - nepal
  - nepali
  - bikram-sambat
  - calendar
  - pdf
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.6
  http: ^1.4.0
  pdf: ^3.13.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# Lets a Flutter app load the bundled fonts with
# rootBundle.load('packages/nepal_kit/lib/fonts/...') (see ReceiptFonts.regularAsset).
flutter:
  assets:
    - lib/fonts/
