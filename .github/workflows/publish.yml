# Publishes a package to pub.dev when its version tag is pushed:
#   nepal_kit-v1.2.3          -> packages/nepal_kit
#   nepal_kit_flutter-v1.2.3  -> packages/nepal_kit_flutter
#
# Uses pub.dev automated publishing (GitHub OIDC); no secret is stored.
# Each package's admin page on pub.dev must allow publishing from
# lohanidamodar/nepal-kit with the matching tag pattern
# ({{package}}-v{{version}}) and the `pub.dev` environment.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'nepal_kit-v[0-9]+.[0-9]+.[0-9]+*'
      - 'nepal_kit_flutter-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Configures the pub.dev OIDC token; flutter's pub reads the same config.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve package from tag
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag%-v*}"
          version="${tag##*-v}"
          dir="packages/$name"
          test -f "$dir/pubspec.yaml" || { echo "no package $name"; exit 1; }
          declared=$(grep -E '^version:' "$dir/pubspec.yaml" | awk '{print $2}')
          if [ "$declared" != "$version" ]; then
            echo "tag says $version but $dir/pubspec.yaml says $declared"; exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: Test
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          if grep -q 'sdk: flutter' pubspec.yaml; then flutter test; else dart test; fi
      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: flutter pub publish --force
